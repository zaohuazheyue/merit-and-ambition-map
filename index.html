      radial-gradient(ellipse at 0% 100%, rgba(180,195,220,.45), transparent 40%),
      radial-gradient(ellipse at 100% 100%,rgba(180,195,220,.40), transparent 38%);
    -webkit-mask:radial-gradient(ellipse 65% 65% at 50% 50%, transparent 55%, black 100%);
            mask:radial-gradient(ellipse 65% 65% at 50% 50%, transparent 55%, black 100%);
    animation:drift 80s ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.06) translateX(-1.5%)}}

  /* 舞台顶部说明 */
  .stage-head{

  /* ===== 便利贴 ===== */
  .clue{

    content:'';position:absolute;top:-9px;left:50%;width:78px;height:20px;
    transform:translateX(-50%) rotate(-3deg);

const map = L.map("map", { center:[39.9042,116.4074], zoom:11 });

/* 坐标系：天地图底图用 WGS84，高德底图用 GCJ-02 —— 按底图自动转换，避免点位偏 300–500 米 */
const USE_GCJ = !TDT_KEY;
function toMapLL(lat, lng){ return USE_GCJ ? wgs2gcj(lat, lng) : [lat, lng]; }    // 外部 WGS → 底图
function fromMapLL(lat, lng){ return USE_GCJ ? gcj2wgs(lat, lng) : [lat, lng]; }  // 底图 → 外部 WGS
function toGcjLL(lat, lng){ return USE_GCJ ? [lat, lng] : wgs2gcj(lat, lng); }    // 底图 → 高德 GCJ

if(TDT_KEY){
  L.tileLayer(`https://t{s}.tianditu.gov.cn/vec_w/wmts?layer=vec&style=default&tilematrixset=w&Service=WMTS&Request=GetTile&Version=1.0.0&Format=tiles&TileMatrix={z}&TileMatrixSet=w&TileRow={y}&TileCol={x}&tk=${TDT_KEY}`, {
    subdomains:["0","1","2","3","4","5","6","7"], maxZoom:18, attribution:"© 天地图"
  }).addTo(map);
  L.tileLayer(`https://t{s}.tianditu.gov.cn/cva_w/wmts?layer=cva&style=default&tilematrixset=w&Service=WMTS&Request=GetTile&Version=1.0.0&Format=tiles&TileMatrix={z}&TileMatrixSet=w&TileRow={y}&TileCol={x}&tk=${TDT_KEY}`, {
    subdomains:["0","1","2","3","4","5","6","7"]
  }).addTo(map);
}else{
  L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
    subdomains:["1","2","3","4"], maxZoom:18, attribution:"© 高德地图"
  }).addTo(map);
}

let rafId = null;
function relayout(){
  const W = stage.clientWidth, H = stage.clientHeight;
  if(!W || !H) return;
  wire.setAttribute("viewBox", `0 0 ${W} ${H}`);
  wire.innerHTML = "";

  const perCol = {left:0, right:0};
  activities.forEach(a=>{ const c = clueEls[a.id]; if(c) perCol[c.side]++; });
  const maxPer = Math.max(perCol.left, perCol.right);
  const level = maxPer >= 4 ? "tiny" : (maxPer >= 3 ? "small" : "");
  document.querySelectorAll(".clue").forEach(el=>{
    el.classList.toggle("small", level === "small");
    el.classList.toggle("tiny",  level === "tiny");
  });
  const cardW = level === "tiny" ? 200 : (level === "small" ? 212 : 238);
  const halfW = cardW / 2 + 6;
  const cxMap = {
    left : Math.max(halfW + 16, W * 0.135),
    right: Math.min(W - halfW - 16, W * 0.865)
  };

  ["left","right"].forEach(side=>{
    const list = activities.filter(a=>clueEls[a.id] && clueEls[a.id].side===side)
                           .sort((a,b)=>b.lat-a.lat);
    const n = list.length;
    if(!n) return;
    list.forEach((a,i)=>{
      const cx = cxMap[side];
      const cy = (i+0.5) * H / n;
      clueEls[a.id].el.style.left = cx+"px";
      clueEls[a.id].el.style.top  = cy+"px";

      const pt = map.latLngToContainerPoint([a.lat,a.lng]);
      const sx = side==="left" ? cx + halfW : cx - halfW;
      const mx = (sx + pt.x) / 2;
      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d", `M ${sx} ${cy} C ${mx} ${cy}, ${mx} ${pt.y}, ${pt.x} ${pt.y}`);
      path.setAttribute("stroke", COLORS[a.type]);
      path.dataset.aid = a.id;
      wire.appendChild(path);
    });
  });
}

["move","zoom","moveend","zoomend","viewreset","resize"].forEach(ev=>
  map.on(ev, ()=>{ cancelAnimationFrame(rafId); rafId = requestAnimationFrame(relayout); })
);

/* ---------- ⑥ 坐标系转换 ---------- */
/* WGS84 → GCJ-02（让 OSM / 路径服务的结果贴合高德底图） */
function wgs2gcj(lat, lng){
  const PI = Math.PI, a = 6378245.0, ee = 0.00669342162296594323;
  if(lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lat, lng];
  const dLat = (x, y)=>{
    let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
    r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
    return r;
  };
  const dLng = (x, y)=>{
    let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
    r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
    return r;
  };
  let dlat = dLat(lng-105, lat-35), dlng = dLng(lng-105, lat-35);
  const radlat = lat/180*PI;
  let magic = Math.sin(radlat); magic = 1 - ee*magic*magic;
  const sq = Math.sqrt(magic);
  dlat = (dlat*180) / ((a*(1-ee)) / (magic*sq) * PI);
  dlng = (dlng*180) / (a / sq * Math.cos(radlat) * PI);
  return [lat + dlat, lng + dlng];
}

/* GCJ-02 → WGS84（迭代逼近） */
function gcj2wgs(lat, lng){
  let wlat = lat, wlng = lng;
  for(let i=0;i<3;i++){
    const g = wgs2gcj(wlat, wlng);
    wlat += lat - g[0];
    wlng += lng - g[1];
  }
  return [wlat, wlng];
}

/* ---------- ⑦ 地理编码 ---------- */
async function geocode(place){
  if(TDT_KEY){
    const url = "https://api.tianditu.gov.cn/geocoder?ds=" +
                encodeURIComponent(JSON.stringify({keyWord: place})) + "&tk=" + TDT_KEY;
    const res = await fetch(url).then(r=>r.json());
    if(res.location) return [parseFloat(res.location.lat), parseFloat(res.location.lon)];
    throw new Error("未找到该地点");
  }
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-CN&q=" +
              encodeURIComponent(place);
  const arr = await fetch(url, {headers:{Accept:"application/json"}}).then(r=>r.json());
  if(!arr.length) throw new Error("未找到该地点");
  return toMapLL(parseFloat(arr[0].lat), parseFloat(arr[0].lon));
}

function locateMe(){
  if(!navigator.geolocation) return toast("当前浏览器不支持定位");
  toast("正在获取当前位置…");
  navigator.geolocation.getCurrentPosition(p=>{
    const [lat,lng] = toMapLL(p.coords.latitude, p.coords.longitude);
    setOrigin(lat, lng, "我的当前位置");
    document.getElementById("originInput").value = "我的当前位置";
    map.setView([lat,lng], Math.max(map.getZoom(), 13));
  }, err=>{
    toast("定位失败（" + (err.message || "权限被拒绝") + "），可直接输入住址");
  }, {enableHighAccuracy:true, timeout:8000});
}

/* ---------- ⑨ 交通方案 ---------- */
const SPEED = { walk:4.8, bus:16, car:24 };   // km/h
const ROAD_FACTOR = 1.35;                     // 路网 / 直线

function distanceKm(a, b){
  const R = 6371, toRad = d=>d*Math.PI/180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const s = Math.sin(dLat/2)**2 +
            Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function fmtMin(m){
  m = Math.max(1, Math.round(m));
  if(m < 60) return m + " 分钟";
  const h = Math.floor(m/60), r = m % 60;
  return h + " 小时" + (r ? " " + r + " 分" : "");
}
function fmtKm(km){ return km < 1 ? Math.round(km*1000) + " 米" : km.toFixed(1) + " km"; }

/* 高德 URI：真实路线 / 实时公交 */
function amapURL(a, mode){
  const [olat,olng] = toGcjLL(ORIGIN.lat, ORIGIN.lng);
  const [tlat,tlng] = toGcjLL(a.lat, a.lng);
  const from = `from=${olng},${olat},${encodeURIComponent(ORIGIN.name)}`;
  const to   = `to=${tlng},${tlat},${encodeURIComponent(a.name)}`;
  return `https://uri.amap.com/navigation?${from}&${to}&mode=${mode}&policy=1&src=dsh-cluewall&callnative=1`;
}

function openTraffic(id, silent){
  const a = activities.find(x=>x.id==id);
  if(!a) return;
  if(!ORIGIN){
    if(!silent){
      toast("请先在顶部设置「出发地」");
      document.getElementById("originInput").focus();
    }
    return;
  }
  trafficTarget = a;

  const straight = distanceKm(ORIGIN, a);
  const road = straight * ROAD_FACTOR;
  const walk = road / SPEED.walk * 60;
  const bus  = road / SPEED.bus * 60 + 8;
  const car  = road / SPEED.car * 60 + 3;
  const fare = 13 + Math.max(0, road - 3) * 2.3;

  document.getElementById("tmTitle").textContent = "🚦 " + a.name;
  document.getElementById("tmSub").innerHTML =
    `<b>${ORIGIN.name}</b> → <b>${a.date} ${a.time}</b><br>` +
    `直线 ${fmtKm(straight)} · 按路网约 ${fmtKm(road)}`;

  const rows = [];
  if(walk <= 150){
    rows.push(modeRow("🚶","步行", fmtMin(walk), `${fmtKm(road)} · 按 4.8 km/h 估算`, amapURL(a,"walk")));
  }
  rows.push(modeRow("🚌","公交 / 地铁", fmtMin(bus),
    `${fmtKm(road)} · 含约 8 分钟候车换乘，实时路线见高德`, amapURL(a,"bus")));
  rows.push(modeRow("🚗","开车 / 打车", fmtMin(car),
    `${fmtKm(road)} · 打车约 ${Math.round(fare)} 元（北京估价）`, amapURL(a,"car")));

  document.getElementById("tmBody").innerHTML = rows.join("");
  document.getElementById("tmodal").classList.add("on");
  clearRoute();
}

function modeRow(ico, name, time, desc, url){
  return `<div class="mode">
    <div class="mode-h"><span class="ico">${ico}</span><b>${name}</b><span class="t">${time}</span></div>
    <div class="mode-d">${desc}</div>
    <a class="mode-a" href="${url}" target="_blank" rel="noopener">在高德查看${name}路线 ↗</a>
  </div>`;
}

function closeTraffic(){ document.getElementById("tmodal").classList.remove("on"); }

/* 真实路网路线：OSRM 公共实例（免密钥，失败则保持估算） */
async function fetchRoute(a, profile){
  const [olat,olng] = fromMapLL(ORIGIN.lat, ORIGIN.lng);
  const [dlat,dlng] = fromMapLL(a.lat, a.lng);
  const base = profile === "foot"
    ? "https://routing.openstreetmap.de/routed-foot/route/v1/driving/"
    : "https://routing.openstreetmap.de/routed-car/route/v1/driving/";
  const url = `${base}${olng},${olat};${dlng},${dlat}?overview=full&geometries=geojson`;
  const opt = (typeof AbortSignal !== "undefined" && AbortSignal.timeout)
    ? {signal: AbortSignal.timeout(8000)} : {};
  const r = await fetch(url, opt).then(x=>x.json());
  if(!r.routes || !r.routes.length) throw new Error("no route");
  return r.routes[0];
}

let lastRoute = null;
async function drawRoute(){
  if(!ORIGIN || !trafficTarget) return toast("请先设置出发地和活动");
  const a = trafficTarget;
  toast("正在规划真实路线…");
  try{
    lastRoute = await fetchRoute(a, "car");
    const pts = lastRoute.geometry.coordinates.map(([lng,lat])=>toMapLL(lat,lng));
    clearRoute();
    routeLayer = L.layerGroup([
      L.polyline(pts, {color:"#4361ee", weight:5, opacity:.85}),
      L.polyline(pts, {color:"#8ec5ff", weight:2, opacity:.9, dashArray:"8 8"})
    ]).addTo(map);
    map.fitBounds(routeLayer.getLayers()[0].getBounds(), {padding:[60,60]});
    const km = (lastRoute.distance/1000).toFixed(1);
    const min = Math.round(lastRoute.duration/60);
    toast(`路网 ${km} km · 驾车约 ${min} 分钟`);
  }catch(e){
    toast("在线路网服务不可用，已保留估算：可点「在高德查看」看真实路线");
  }
}

function clearRoute(){
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
  lastRoute = null;
}

/* 日期与文案：全部由 activities 推导，以后改活动不用动这里 */
function fmtDate(d){ const p = String(d).split("-"); return p[1] ? p[0] + "." + p[1] : String(d); }
function dateRange(){
  const ds = [...new Set(activities.map(a=>a.date).filter(Boolean))].sort();
  if(!ds.length) return "本周";
  const a = fmtDate(ds[0]), b = fmtDate(ds[ds.length-1]);
  return a === b ? a : a + " – " + b;
}
function weekLine(){

}
function shareDesc(){

  return `${dateRange()} 北京 ${n} 场活动${first ? "：首场 " + first : ""}，时间 / 收费 / 报名入口见图`;

const FONT_SC = "'PingFang SC','Microsoft YaHei',sans-serif";

const COVER   = {W:1080, H:1350};
const MAP_BOX = {x:56, y:236, w:968, h:776};
const GEO     = {lat0:39.72, lat1:40.10, lng0:116.24, lng1:116.58};
const COVER_MAX_CARDS = 4;
function buildCardBoxes(list){
  const shown = Math.min(list.length, COVER_MAX_CARDS);
  const boxes = [];
  const h = 232, gapY = 26;
  const rows = Math.ceil(shown / 2);
  const totalH = rows * h + (rows - 1) * gapY;
  const y0 = MAP_BOX.y + (MAP_BOX.h - totalH) / 2 + 6;
  for(let i=0;i<shown;i++){
    const r = Math.floor(i/2), isLeft = i % 2 === 0;
    const x = shown === 1 ? (1080 - 326) / 2 : (isLeft ? 84 : 674);
    boxes.push({x, y: y0 + r*(h+gapY), w:326, h, act:list[i]});
  }
  return boxes;
}

let shareCanvas = null, shareSeq = 0, lastQR = "";

/* --- 绘图小工具 --- */
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function ellip(g, text, maxW){
  if(g.measureText(text).width <= maxW) return text;
  let t = text;
  while(t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0,-1);
  return t + "…";
}
function tokenize(text){
  const out = [];
  const re = /[A-Za-z0-9]+(?:[–—\-:.\/][A-Za-z0-9]+)*|\s+|[\s\S]/gu;
  let m;
  while((m = re.exec(text))){
    out.push(/^\s+$/.test(m[0]) ? " " : m[0]);
  }
  return out;
}
function wrapText(g, text, maxW, maxLines){
  const toks = tokenize(text), lines = [];
  let cur = "";
  for(let i=0;i<toks.length;i++){
    const tok = toks[i];
    if(cur === "" && tok === " ") continue;
    if(g.measureText(cur + tok).width <= maxW){ cur += tok; continue; }

    if(tok === " "){ lines.push(cur.replace(/\s+$/,"")); cur = ""; continue; }

    if(cur === ""){                       // 单个词块就超宽 → 硬切
      let piece = "";
      for(const ch of tok){
        if(g.measureText(piece + ch).width <= maxW) piece += ch;
        else { lines.push(piece); piece = ch; }
      }
      cur = piece;
      continue;
    }

    lines.push(cur.replace(/\s+$/,""));
    cur = tok;
    if(lines.length === maxLines - 1){    // 最后一行：剩余内容拼起来，超宽加省略号
      const rest = (cur + toks.slice(i+1).join("")).replace(/\s+/g," ").trim();
      let last = rest;
      while(last && g.measureText(last + "…").width > maxW) last = last.slice(0,-1);
      lines.push(last + (last.length < rest.length ? "…" : ""));
      return lines;
    }
  }
  if(cur.trim()) lines.push(cur.replace(/\s+$/,""));
  return lines;
}
function proj(lat, lng){
  const pad = 54;
  const x = MAP_BOX.x + pad + (lng-GEO.lng0)/(GEO.lng1-GEO.lng0) * (MAP_BOX.w-2*pad);
  const y = MAP_BOX.y + pad + (GEO.lat1-lat)/(GEO.lat1-GEO.lat0) * (MAP_BOX.h-2*pad);
  return [x,y];
}
function cardAnchor(card, dot){
  const cx = card.x + card.w/2, cy = card.y + card.h/2;
  const dx = dot[0]-cx, dy = dot[1]-cy;
  const L = Math.hypot(dx,dy) || 1;
  const cands = [
    {p:[card.x+card.w, cy], v:[1,0]},
    {p:[card.x, cy],        v:[-1,0]},
    {p:[cx, card.y],        v:[0,-1]},
    {p:[cx, card.y+card.h], v:[0,1]}
  ];
  let best = cands[0], bs = -1e9;
  for(const c of cands){
    const s = (dx*c.v[0] + dy*c.v[1]) / L;
    if(s > bs){ bs = s; best = c; }
  }
  return best.p;
}

/* --- 封面绘制 --- */
function drawMapBase(g){
  const {x,y,w,h} = MAP_BOX;
  g.strokeStyle = "rgba(168,148,118,.20)"; g.lineWidth = 1;
  for(let gx=x; gx<=x+w; gx+=64){ g.beginPath(); g.moveTo(gx,y); g.lineTo(gx,y+h); g.stroke(); }
  for(let gy=y; gy<=y+h; gy+=64){ g.beginPath(); g.moveTo(x,gy); g.lineTo(x+w,gy); g.stroke(); }

  const [cx,cy] = proj(39.9042,116.4074);
  g.strokeStyle = "rgba(150,128,98,.42)"; g.lineWidth = 3;
  [95,150,215].forEach(r=>{
    g.beginPath(); g.ellipse(cx,cy,r*1.25,r,0,0,Math.PI*2); g.stroke();
  });
  g.strokeStyle = "rgba(150,128,98,.26)"; g.lineWidth = 4;
  for(let a=0;a<8;a++){
    const ang = a*Math.PI/4 + .21;
    g.beginPath(); g.moveTo(cx,cy);
    g.lineTo(cx+Math.cos(ang)*560, cy+Math.sin(ang)*520); g.stroke();
  }

  g.fillStyle = "rgba(120,100,75,.52)";
  g.font = `400 20px ${FONT_SC}`;
  g.fillText("昌平", 452, 300);
  g.fillText("海淀", 128, 600);
  g.fillText("城区", 596, 592);
  g.fillText("亦庄", 862, 806);
}
function drawConnector(g, card, dot, color){
  const [ax,ay] = cardAnchor(card, dot);
  const mx = (ax + dot[0]) / 2;
  g.save();
  g.setLineDash([9,7]); g.lineWidth = 3; g.strokeStyle = color; g.globalAlpha = .75;
  g.beginPath(); g.moveTo(ax,ay); g.quadraticCurveTo(mx, ay, dot[0], dot[1]); g.stroke();
  g.restore();
}
function fitTitle(g, text, maxW, maxLines){
  for(const size of [22,21,20,19,18,17]){
    g.font = `700 ${size}px ${FONT_SC}`;
    const lines = wrapText(g, text, maxW, maxLines);
    const last = lines[lines.length-1] || "";
    const orphan = lines.length > 1 && g.measureText(last).width < maxW * 0.35;
    if(!orphan) return {size, lines};
  }
  g.font = `700 17px ${FONT_SC}`;
  return {size:17, lines: wrapText(g, text, maxW, maxLines)};
}
function drawCard(g, card, a){
  const c = COLORS[a.type], note = NOTE[a.type];
  const px = card.x + 26, innerW = card.w - 52;

  g.save();
  g.shadowColor = "rgba(60,45,20,.24)"; g.shadowBlur = 16; g.shadowOffsetY = 8;
  rr(g, card.x, card.y, card.w, card.h, 10);
  g.fillStyle = note; g.fill();
  g.restore();

  g.save();
  rr(g, card.x, card.y, card.w, card.h, 10); g.clip();
  g.fillStyle = c; g.fillRect(card.x, card.y, 8, card.h);
  g.restore();

  // 胶带
  g.save();
  g.translate(card.x + card.w/2, card.y); g.rotate(-0.035);
  g.fillStyle = "rgba(255,255,255,.62)"; g.fillRect(-44,-9,88,18);
  g.restore();

  // 分类标签
  g.font = `700 16px ${FONT_SC}`;
  const tag = TAG[a.type];
  const tw = g.measureText(tag).width + 20;
  rr(g, px, card.y+18, tw, 24, 12); g.fillStyle = c; g.fill();
  g.fillStyle = "#fff"; g.fillText(tag, px+10, card.y+22);

  // 报名平台
  g.font = `400 15px ${FONT_SC}`;
  const src = ellip(g, (a.links[0] && a.links[0].label) || "", 120);
  const sw = g.measureText(src).width + 16;
  rr(g, card.x+card.w-26-sw, card.y+18, sw, 24, 12);
  g.fillStyle = "rgba(255,255,255,.75)"; g.fill();
  g.fillStyle = "#6a5a48"; g.fillText(src, card.x+card.w-26-sw+8, card.y+23);

  // 标题（自动缩字号，避免最后一行只剩一两个字）
  const fit = fitTitle(g, a.name, innerW, 3);
  g.fillStyle = "#332a24";
  g.font = `700 ${fit.size}px ${FONT_SC}`;
  const lineH = Math.round(fit.size * 1.28);
  fit.lines.forEach((ln,i)=> g.fillText(ln, px, card.y+54+i*lineH));

  // 信息行（过长的自动折到第二行）
  g.font = `400 18px ${FONT_SC}`;
  g.fillStyle = "#4a3f35";
  const rows = [
    a.date + " " + a.time,
    "时长 " + a.duration,
    "收费 " + a.fee
  ];
  let ry = card.y + 54 + fit.lines.length*lineH + 8;
  rows.forEach(t=>{
    wrapText(g, t, innerW, 2).forEach(ln=>{
      g.fillText(ln, px, ry);
      ry += 26;
    });
  });
}

async function qrImage(text){
  return new Promise(res=>{
    if(!text) return res(null);
    try{
      if(typeof qrcode !== "function") return res(null);
      const qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      const img = new Image();
      img.onload = ()=> res(img);
      img.onerror = ()=> res(null);
      img.src = qr.createDataURL(8, 0);
    }catch(e){ res(null); }
  });
}

async function buildCover(qrLink){
  const {W,H} = COVER;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.textBaseline = "top";
  if(qrLink !== lastQR){ lastQR = qrLink; }

  const bg = g.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#0d1b2a"); bg.addColorStop(1,"#1b2d46");
  g.fillStyle = bg; g.fillRect(0,0,W,H);

  g.save();
  g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 40; g.shadowOffsetY = 14;
  rr(g,24,24,W-48,H-48,30); g.fillStyle = "#f8f3e6"; g.fill();
  g.restore();

  g.save();
  rr(g,24,24,W-48,H-48,30); g.clip();
  g.fillStyle = "rgba(190,175,150,.32)";
  for(let y=52;y<H-30;y+=28) for(let x=52;x<W-30;x+=28) g.fillRect(x,y,1.6,1.6);
  g.restore();

  g.fillStyle = "#1b2a3a"; g.font = `700 52px ${FONT_SC}`;
  g.fillText(SHARE_TITLE, 72, 84);
  g.fillStyle = "#6a7a8c"; g.font = `400 25px ${FONT_SC}`;
  g.fillText(weekLine(), 74, 156);
  rr(g,72,202,132,7,3.5); g.fillStyle = "#e0a020"; g.fill();

  // 地图面板
  g.save();
  rr(g,MAP_BOX.x,MAP_BOX.y,MAP_BOX.w,MAP_BOX.h,18);
  g.fillStyle = "#efe6d3"; g.fill();
  g.strokeStyle = "#d9cbaf"; g.lineWidth = 2; g.stroke();
  g.clip();
  drawMapBase(g);
  const boxes = buildCardBoxes(activities);
  boxes.forEach(b=> drawConnector(g, b, proj(b.act.lat, b.act.lng), COLORS[b.act.type]));
  g.restore();

  boxes.forEach(b=> drawCard(g, b, b.act));

  if(activities.length > COVER_MAX_CARDS){
    const more = `另有 ${activities.length - COVER_MAX_CARDS} 场活动 · 详见地图页`;
    g.font = `700 21px ${FONT_SC}`;
    const tw = g.measureText(more).width + 44;
    rr(g, 1024 - tw, MAP_BOX.y + MAP_BOX.h - 60, tw, 38, 19);
    g.fillStyle = "rgba(27,42,58,.85)"; g.fill();
    g.fillStyle = "#fff";
    g.fillText(more, 1024 - tw + 22, MAP_BOX.y + MAP_BOX.h - 50);
  }

  // 页脚
  g.strokeStyle = "rgba(200,186,160,.95)"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(72,1032); g.lineTo(1008,1032); g.stroke();

  const qr = qrLink ? await qrImage(qrLink) : null;
  if(qr){
    rr(g,72,1056,168,168,14); g.fillStyle = "#fff"; g.fill();
    g.drawImage(qr,80,1064,152,152);
  }else{
    g.save(); g.setLineDash([9,7]); g.strokeStyle = "#cbbfa6"; g.lineWidth = 2;
    rr(g,72,1056,168,168,14); g.stroke(); g.restore();
    g.fillStyle = "#a89a80"; g.font = `400 18px ${FONT_SC}`;
    g.fillText("二维码", 120, 1122);
    g.fillText("待生成", 120, 1150);
  }

  const tx = 280;
  g.fillStyle = "#1b2a3a"; g.font = `700 30px ${FONT_SC}`;
  g.fillText(qr ? "扫码打开活动地图" : (qrLink ? "二维码待生成" : "分享链接未设置"), tx, 1070);
  g.fillStyle = "#6a7a8c"; g.font = `400 21px ${FONT_SC}`;
  g.fillText(activities.length + " 场活动的时间、时长、收费与报名入口都在图里", tx, 1116);
  g.font = `400 18px ${FONT_SC}`;
  if(qrLink){
    g.fillStyle = "#8d9aa8"; g.fillText(ellip(g, qrLink, 700), tx, 1156);
  }else{
    g.fillStyle = "#b07a3a";
    g.fillText("把部署后的网址填进「分享链接」，二维码会自动生成", tx, 1156);
  }

  g.fillStyle = "#9aa7b4"; g.font = `400 19px ${FONT_SC}`;
  g.fillText("志远行共学地图 · 每周更新", 72, 1268);
  g.textAlign = "right";
  g.fillText(dateRange() + " · BEIJING", 1008, 1268);
  g.textAlign = "left";

  return cv;
}
